<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essentia</title>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Open+Sans&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/loja.css">
<link rel="stylesheet" href="../css/nav.css">
</head>
<body data-page="postar-obra">
<div class="app">
<section class="screen ativa" id="postar-obra">
  <header class="topo verde-esc">
    <button class="voltar" onclick="back()">←</button>
    <span class="titulo">Detalhes da Obra</span>
  </header>
  <form class="dados" onsubmit="event.preventDefault();toast('Obra postada');setTimeout(()=>go('perfil'),900)">
    <label>Título da Obra:<input placeholder="Obra sem título" required></label>
    <label>Descrição da Obra:<textarea rows="5" placeholder="Obra sem descrição"></textarea></label>
    <label>Selecione o tipo de obra:<select required>
      <option value="">Tipo de arquivo</option>
      <option>Desenho e Arte Digital</option>
      <option>Quadro físico</option>
      <option>Vídeo</option>
      <option>Audio</option>
      <option>Evento</option>
    </select></label>
    <label>Carregar arquivo:
      <span class="upload" id="up">⬇ Baixar arquivo</span>
      <input type="file" id="arq" hidden>
    </label>
    <p class="sub">Definição:</p>
    <label class="opcao">
      <span>Apenas Exposição</span>
      <input type="checkbox" id="exp" checked>
    </label>
    <label class="opcao">
      <span>Venda</span>
      <input type="checkbox" id="venda">
    </label>
    <label class="opcao">
      <span>Evento</span>
      <input type="checkbox" id="evento">
    </label>
    <div id="venda-campos" hidden>
      <label>Valor da Obra:<input id="valor" inputmode="decimal" placeholder="R$: 00,00"></label>
      <label>Modo de Pagamento:<select>
        <option>Tipo de pagamento aceito</option>
        <option>Cartão</option>
        <option>PIX</option>
      </select></label>
    </div>
    <button class="btn v larg">Postar</button>
  </form>
</section>
</div>
<script src="../js/nav.js"></script>
<script src="../js/postar.js"></script>
</body>
</html>
